[workspace]
members = [
    "examples/math",
    "framework/crates/host",
    "framework/crates/nats-link",
    "framework/crates/oci-fetch",
    "framework/crates/protocol",
    "framework/crates/registry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wasm-host = { path = "framework/crates/host" }
wasm-nats-link = { path = "framework/crates/nats-link" }
wasm-oci-fetch = { path = "framework/crates/oci-fetch" }
wasm-protocol = { path = "framework/crates/protocol" }
wasm-registry = { path = "framework/crates/registry" }

wasmtime = { version = "48.0.1", default-features = false }
wit-component = { version = "0.254.0", default-features = false }
wit-parser = "0.254.0"

anyhow = "1.0.104"
async-nats = "0.50.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
oci-client = { version = "0.17.0", default-features = false, features = [
    "rustls-tls",
] }
oci-wasm = { version = "0.6.0", default-features = false, features = [
    "rustls-tls",
] }
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
