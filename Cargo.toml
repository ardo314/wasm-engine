[workspace]
members = ["examples/math", "framework/crates/protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wasm-protocol = { path = "framework/crates/protocol" }

wasmtime = { version = "48.0.1", default-features = false }
wit-parser = "0.254.0"

rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
